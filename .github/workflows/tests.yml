name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancels an outdated run when a new commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API and Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automated_testing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automated_testing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      # The gate: every scenario except the intentional defects must pass.
      - name: Run tests (without known defects)
        run: npm run test:no-bugs

      # The intentional defects must keep failing. If one of these scenarios
      # passes, a defect changed and the documentation is out of date.
      - name: Check that the 15 known defects still fail
        run: |
          if npm run test:known-bugs -- --reporter=list > known-bugs.log 2>&1; then
            echo "::error::Known-defect scenarios passed. Update the @known_bug tags and docs."
            exit 1
          fi
          grep -E "^\s+[0-9]+ (passed|failed)" known-bugs.log
          if ! grep -qE "^\s+15 failed" known-bugs.log || grep -qE "^\s+[0-9]+ passed" known-bugs.log; then
            grep "✓" known-bugs.log || true
            echo "::error::Expected exactly 15 failures and no passes in the @known_bug scenarios."
            exit 1
          fi

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automated_testing/playwright-report/
          retention-days: 14
