<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food Marketplace</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <a class="brand" id="header-brand" href="/" data-link>Food Marketplace</a>
        <nav class="header-nav" aria-label="Main">
          <a class="cart-link" id="header-cart-link" href="/cart" data-link>
            Cart <span class="badge" id="cart-count">0</span>
          </a>
          <span id="session"></span>
        </nav>
      </div>
    </header>

    <main class="container">
      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
      <div id="view"></div>
    </main>

    <dialog id="confirm-dialog" class="confirm" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Switch company?</h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button type="button" class="button secondary" id="confirm-no">No</button>
        <button type="button" class="button" id="confirm-yes">Yes</button>
      </div>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
